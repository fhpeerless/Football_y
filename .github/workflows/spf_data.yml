name: SPF Data Collection

on:
  schedule:
    # 北京时间 8:01, 9:01, 11:01, 12:01, 14:01, 20:01, 22:01 执行 (UTC = BJT-8)
    - cron: '1 0,1,3,4,6,12,14 * * *'
  workflow_dispatch:

jobs:
  collect-spf-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCF_FUNCTION_URL: ${{ secrets.SCF_FUNCTION_URL }}
      SCF_TOKEN: ${{ secrets.SCF_TOKEN }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        pip install requests

    - name: 获取所有比赛赔率数据
      working-directory: ./spf
      run: |
        echo "=== 获取所有比赛赔率数据 ==="
        python mobile_spf_fetcher.py
        echo "=== 数据获取完成 ==="

    - name: 获取半全场赔率数据
      working-directory: ./spf/banqch_spf
      run: |
        echo "=== 获取半全场赔率数据 ==="
        python mobile_bqc_fetcher.py
        echo "=== 数据获取完成 ==="

    - name: 爬取历史数据
      working-directory: ./spf
      run: |
        echo "=== 爬取历史数据 ==="
        python spf_fetch_history.py
        echo "=== 爬取完成 ==="

    - name: 分析共同对手
      working-directory: ./spf
      run: |
        echo "=== 分析共同对手 ==="
        python spf_common_opponents.py
        echo "=== 分析完成 ==="

    - name: 提交 SPF 数据到仓库
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add spf/data/

        git commit -m "更新SPF/BQC赔率数据及共同对手数据" || {
          echo "没有更改可提交，跳过push步骤"
          exit 0
        }

        # 远端 main 可能被本地 sync_to_github.py 强推改写、或与其他工作流并发，
        # 直接 push 会因历史分叉被拒；失败时先 fetch + rebase 远端再重试
        PUSH_URL="https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        for attempt in 1 2 3; do
          echo "第 ${attempt} 次尝试 push..."
          if git push "$PUSH_URL" "HEAD:${{ github.ref_name }}"; then
            echo "push 成功"
            exit 0
          fi
          echo "push 失败，拉取远端最新代码并变基后重试..."
          git fetch "$PUSH_URL" "${{ github.ref_name }}" || exit 1
          if ! git rebase FETCH_HEAD; then
            echo "与远端代码冲突，自动变基失败（远端未受影响，可稍后运行本地 sync_to_github.py 合并同步）"
            git rebase --abort
            exit 1
          fi
        done
        echo "push 连续 3 次失败，工作流退出"
        exit 1
