name: c_SPF_AI_分析

on:
  workflow_dispatch:
    inputs:
      match_num:
        description: '比赛编号（match_num）'
        required: false
        default: ''
        type: string
      home:
        description: '主队名称'
        required: false
        default: ''
        type: string
      away:
        description: '客队名称'
        required: false
        default: ''
        type: string

jobs:
  ai-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PUSH_URL: "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 阶段 1：联网搜索（Tavily），结果保存到 spf/data/tavily_result/{match_num}_internet.json
    - name: 联网搜索（Tavily）
      run: |
        python spf/ai_workflow.py \
          --match-num "${{ inputs.match_num }}" \
          --home "${{ inputs.home }}" \
          --away "${{ inputs.away }}" \
          --stage search

    # 搜索完成后立即提交，即使后续 DeepSeek 分析失败，联网结果也已保留
    - name: 提交联网搜索结果
      run: bash spf/commit_results.sh "更新联网搜索结果" "spf/data/tavily_result/*_internet.json"

    # 阶段 2：DeepSeek 综合共同对手数据 + 联网搜索结果分析，写入 spf/data/deepseek_result/{match_num}ai_results.json
    - name: DeepSeek 综合分析
      run: |
        python spf/ai_workflow.py \
          --match-num "${{ inputs.match_num }}" \
          --home "${{ inputs.home }}" \
          --away "${{ inputs.away }}" \
          --stage analyze

    - name: 提交 AI 分析结果到仓库
      run: bash spf/commit_results.sh "更新 AI 分析结果" "spf/data/deepseek_result/*ai_results.json"
