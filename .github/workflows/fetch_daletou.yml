name: 获取大乐透历史开奖数据

on:
  schedule:
    # 每 3 天执行一次（UTC 00:00，北京时间 08:00）
    # cron 不支持 66 小时，每 3 天（72 小时）是最接近的方案
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  fetch-lottery-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SCF_FUNCTION_URL: ${{ secrets.SCF_FUNCTION_URL }}
      SCF_TOKEN: ${{ secrets.SCF_TOKEN }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        pip install requests

    - name: 抓取超级大乐透历史开奖数据（通过 SCF 代理）
      working-directory: ./z_daletou/requests
      run: |
        echo "=== 抓取超级大乐透历史开奖数据（代理模式） ==="
        python fetch_daletou_data.py
        echo "=== 抓取完成 ==="

    - name: 执行5种方法预测号码
      working-directory: ./z_daletou/requests
      run: |
        echo "=== 使用5种方法预测下一期号码 ==="
        python predict_daletou.py
        echo "=== 预测完成 ==="

    - name: 提交数据到仓库
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add z_daletou/kaijiangdata/daletou_history.json z_daletou/kaijiangdata/daletou_prediction.json

        git commit -m "更新超级大乐透历史开奖数据及5种方法预测" || {
          echo "数据无变化，跳过push步骤"
          exit 0
        }

        # 远端 main 可能被本地 sync_to_github.py 强推改写、或与其他工作流并发，
        # 直接 push 会因历史分叉被拒；失败时先 fetch + rebase 远端再重试
        PUSH_URL="https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        for attempt in 1 2 3; do
          echo "第 ${attempt} 次尝试 push..."
          if git push "$PUSH_URL" "HEAD:${{ github.ref_name }}"; then
            echo "push 成功"
            exit 0
          fi
          echo "push 失败，拉取远端最新代码并变基后重试..."
          git fetch "$PUSH_URL" "${{ github.ref_name }}" || exit 1
          if ! git rebase FETCH_HEAD; then
            echo "与远端代码冲突，自动变基失败（远端未受影响，可稍后运行本地 sync_to_github.py 合并同步）"
            git rebase --abort
            exit 1
          fi
        done
        echo "push 连续 3 次失败，工作流退出"
        exit 1
