name: Cleanup Old Results

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        fetch-depth: 0
      
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 运行清理脚本
      run: |
        echo "=== 开始清理旧结果文件 ==="
        python 14chang/scripts/cleanup_old_results.py
        echo "=== 清理完成 ==="
        
    - name: 提交更改到仓库
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add 14chang/result/
        
        git commit -m "清理旧结果文件" || {
          echo "没有更改可提交"
          exit 0
        }
        
        # 远端 main 可能被本地 sync_to_github.py 强推改写、或与其他工作流并发，
        # 直接 push 会因历史分叉被拒；失败时先 fetch + rebase 远端再重试
        PUSH_URL="https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        for attempt in 1 2 3; do
          echo "第 ${attempt} 次尝试 push..."
          if git push "$PUSH_URL" "HEAD:${{ github.ref_name }}"; then
            echo "push 成功"
            exit 0
          fi
          echo "push 失败，拉取远端最新代码并变基后重试..."
          git fetch "$PUSH_URL" "${{ github.ref_name }}" || exit 1
          if ! git rebase FETCH_HEAD; then
            echo "与远端代码冲突，自动变基失败（远端未受影响，可稍后运行本地 sync_to_github.py 合并同步）"
            git rebase --abort
            exit 1
          fi
        done
        echo "push 连续 3 次失败，工作流退出"
        exit 1
