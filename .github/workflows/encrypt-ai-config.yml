name: 加密 AI 配置

on:
  workflow_dispatch:
    inputs:
      password:
        description: '访问密码（留空则使用 Secret: AI_PASSWORD）'
        required: false
        type: string
      deepseek_key:
        description: 'DeepSeek API Key（留空则使用 Secret: DEEPSEEK_API_KEY）'
        required: false
        type: string
      search_key:
        description: 'Tavily 搜索 Key（可选，留空则使用 Secret: SEARCH_API_KEY）'
        required: false
        type: string
      gh_token:
        description: 'GitHub Token（可选，留空则使用 Secret: GH_TOKEN，用于网页触发 AI 分析工作流）'
        required: false
        type: string

jobs:
  encrypt-ai-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    - name: 运行加密脚本
      working-directory: ./spf
      env:
        AI_CONFIG_PASSWORD: ${{ inputs.password || secrets.AI_PASSWORD }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek_key || secrets.DEEPSEEK_API_KEY }}
        SEARCH_API_KEY: ${{ inputs.search_key || secrets.SEARCH_API_KEY }}
        GH_TOKEN: ${{ inputs.gh_token || secrets.GH_TOKEN }}
      run: node encrypt_ai_config.js

    - name: 提交 ai_config.json 到仓库
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add spf/ai_config.json

        git commit -m "更新加密 AI 配置" || {
          echo "没有更改可提交，跳过push步骤"
          exit 0
        }

        # 远端 main 可能被本地 sync_to_github.py 强推改写、或与其他工作流并发，
        # 直接 push 会因历史分叉被拒；失败时先 fetch + rebase 远端再重试
        PUSH_URL="https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        for attempt in 1 2 3; do
          echo "第 ${attempt} 次尝试 push..."
          if git push "$PUSH_URL" "HEAD:${{ github.ref_name }}"; then
            echo "push 成功"
            exit 0
          fi
          echo "push 失败，拉取远端最新代码并变基后重试..."
          git fetch "$PUSH_URL" "${{ github.ref_name }}" || exit 1
          if ! git rebase FETCH_HEAD; then
            echo "与远端代码冲突，自动变基失败（远端未受影响，可稍后运行本地 sync_to_github.py 合并同步）"
            git rebase --abort
            exit 1
          fi
        done
        echo "push 连续 3 次失败，工作流退出"
        exit 1
